esphome:
  name: "mcintosh-ma5300"
  friendly_name: McIntosh - MA 5300
  min_version: 2025.11.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

external_components:
  - source: github://The-sultan/esphome-mcintosh-ma5300
    components: [mcintosh_ma5300]

# Enable logging
logger:
  level: DEBUG
# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

web_server:

uart:
  id: mc_uart
  tx_pin: GPIO25
  rx_pin: GPIO26
  baud_rate: 115200
  data_bits: 8
  parity: NONE
  stop_bits: 1

mcintosh_ma5300:
  id: mc
  uart_id: mc_uart

text_sensor:
  - platform: mcintosh_ma5300
    mcintosh_ma5300_id: mc
    type: serial_number
    name: "Serial Number"
    disabled_by_default: true
  - platform: mcintosh_ma5300
    mcintosh_ma5300_id: mc
    type: firmware_version
    name: "Firmware Version"
    disabled_by_default: true
  - platform: mcintosh_ma5300
    mcintosh_ma5300_id: mc
    type: da_version
    name: "DA Version"
    disabled_by_default: true
  - platform: mcintosh_ma5300
    mcintosh_ma5300_id: mc
    type: last_error
    name: "Last Error"
    disabled_by_default: true

media_player:
  - platform: mcintosh_ma5300
    mcintosh_ma5300_id: mc
    name: "MA5300"

select:
  - platform: mcintosh_ma5300
    mcintosh_ma5300_id: mc
    type: input
    name: "Input"
    # input_labels: (optional) Map input index numbers to custom display names.
    # These labels appear in Home Assistant instead of the default protocol names
    # (BAL, UNBAL 1, COAX 1, etc.), matching what you see on the amp's display.
    # Only define the inputs you want to rename — unlabelled ones keep their default name.
    # Input index reference: 1=BAL, 2-5=UNBAL 1-4, 6=MM PHONO, 7=COAX 1,
    #   8=COAX 2, 9=OPTI 1, 10=OPTI 2, 11=USB, 12=MCT, 13=HDMI
    # input_labels:
    #   6: "TurnTable"  # MM PHONO
    #   7: "Streamer"   # COAX 1
    #   9: "TV"         # OPTI 1
  - platform: mcintosh_ma5300
    mcintosh_ma5300_id: mc
    type: display_brightness
    name: "Display Brightness"
    disabled_by_default: true

binary_sensor:
  - platform: mcintosh_ma5300
    mcintosh_ma5300_id: mc
    type: headphones
    name: "Headphones"
    disabled_by_default: true

switch:
  - platform: mcintosh_ma5300
    mcintosh_ma5300_id: mc
    type: tone
    name: "Tone"
    disabled_by_default: true
  - platform: mcintosh_ma5300
    mcintosh_ma5300_id: mc
    type: mono
    name: "Mono"
    disabled_by_default: true
  - platform: mcintosh_ma5300
    mcintosh_ma5300_id: mc
    type: meter_lights
    name: "Meter Lights"
    disabled_by_default: true
  - platform: mcintosh_ma5300
    mcintosh_ma5300_id: mc
    type: headphone_hxd
    name: "Headphone HXD"
    disabled_by_default: true

number:
  - platform: mcintosh_ma5300
    mcintosh_ma5300_id: mc
    type: bass
    name: "Bass"
    disabled_by_default: true
  - platform: mcintosh_ma5300
    mcintosh_ma5300_id: mc
    type: treble
    name: "Treble"
    disabled_by_default: true
  - platform: mcintosh_ma5300
    mcintosh_ma5300_id: mc
    type: balance
    name: "Balance"
    disabled_by_default: true
  - platform: mcintosh_ma5300
    mcintosh_ma5300_id: mc
    type: input_trim
    name: "Input Trim"
    disabled_by_default: true

button:
  - platform: mcintosh_ma5300
    mcintosh_ma5300_id: mc
    type: query
    name: "Query State"
    disabled_by_default: true
  - platform: mcintosh_ma5300
    mcintosh_ma5300_id: mc
    type: discover_inputs
    name: "Discover Inputs"
    disabled_by_default: true
  - platform: mcintosh_ma5300
    mcintosh_ma5300_id: mc
    type: volume_up
    name: "Volume Up"
  - platform: mcintosh_ma5300
    mcintosh_ma5300_id: mc
    type: volume_down
    name: "Volume Down"